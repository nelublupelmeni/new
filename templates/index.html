
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Старение фото</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-lg p-4 rounded-4">
      <h2 class="text-center mb-4">Эффект старой фотографии</h2>
      <form method="POST" enctype="multipart/form-data" class="text-center">
          <input class="form-control mb-3" type="file" name="image" accept="image/*" required>
          <button type="submit" class="btn btn-primary btn-lg">Обработать</button>
      </form>
    </div>
  </div>
</body>
</html>
