<!DOCTYPE html>
<html>
<head>
    <title>Photo Aging App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Состаривание фотографий</h1>
    
    <div>
        <p>Выберите одно или несколько изображений для обработки:</p>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div id="fileList"></div>
    </div>

    <!-- Основной контейнер для фото и ползунков -->
    <div class="main-container">
        <!-- Левая часть - фотография -->
        <div class="preview-section">
            <h3>Предпросмотр:</h3>
            <div class="preview-buttons">
                <button id="showOriginalBtn" onclick="showOriginal()">Посмотреть оригинал</button>
                <button id="showProcessedBtn" onclick="showProcessed()">Посмотреть результат</button>
            </div>
            <div>
                <img id="previewImage" src="#" style="display:none;">
            </div>
        </div>

        <!-- Правая часть - ползунки -->
        <div class="controls-section">
            <h3>Эффекты:</h3>
            
            <!-- Сепия -->
            <div class="control-group">
                <h4>Сепия: <span id="sepiaValue">0</span></h4>
                <input type="range" id="sepiaSlider" min="0" max="1" step="0.1" value="0">
            </div>

            <!-- Шум -->
            <div class="control-group">
                <h4>Шум: <span id="noiseValue">0</span></h4>
                <input type="range" id="noiseSlider" min="0" max="100" value="0">
            </div>

            <!-- Царапины -->
            <div class="control-group">
                <h4>Царапины</h4>
                <div>
                    <label>Плотность: <span id="densityValue">5</span></label>
                    <input type="range" id="scratchesDensity" min="1" max="20" value="5">
                </div>
                <div>
                    <label>Прозрачность: <span id="alphaValue">0.5</span></label>
                    <input type="range" id="scratchesAlpha" min="0" max="1" step="0.1" value="0.5">
                </div>
                <div>
                    <label>Минимальный размер: <span id="minSizeValue">0.1</span></label>
                    <input type="range" id="scratchesMinSize" min="0.05" max="0.5" step="0.05" value="0.1">
                </div>
                <div>
                    <label>Максимальный размер: <span id="maxSizeValue">0.3</span></label>
                    <input type="range" id="scratchesMaxSize" min="0.1" max="1" step="0.05" value="0.3">
                </div>
                <div style="margin-top: 10px;">
                    <button id="generateScratchesBtn" onclick="generateScratches()">Сгенерировать царапины</button>
                    <button id="removeScratchesBtn" onclick="removeScratches()" style="display: none;">Убрать царапины</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопки действий -->
    <div class="action-buttons">
        <button onclick="resetSettings()">Сбросить настройки</button>
        <div style="display: inline-block; position: relative;">
            <button id="downloadBtn" style="display:none;" onclick="toggleDownloadMenu()">Скачать результат</button>
            <div id="downloadMenu" style="display: none; position: absolute; background: white; border: 1px solid #ccc; padding: 10px; z-index: 1000;">
                <div><strong>Форматы:</strong></div>
                <button onclick="downloadWithFormat('jpg', 'high')">JPG - Высокое качество</button>
                <button onclick="downloadWithFormat('jpg', 'medium')">JPG - Среднее качество</button>
                <button onclick="downloadWithFormat('jpg', 'low')">JPG - Низкое качество</button>
                <button onclick="downloadWithFormat('png')">PNG - Без потерь</button>
                <button onclick="downloadWithFormat('webp', 'high')">WebP - Высокое качество</button>
                <button onclick="downloadWithFormat('webp', 'medium')">WebP - Среднее качество</button>
            </div>
        </div>
    </div>

    <script>
        let currentFiles = [];
        let currentFileIndex = 0;
        let processedFiles = {};
        let addScratchesFlag = false;
        let currentPreviewMode = 'processed';
        let originalImageData = null;

        // Обработка загрузки файлов
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                currentFiles = files;
                currentFileIndex = 0;
                processedFiles = {};
                currentPreviewMode = 'processed';
                
                displayFileList(files);
                loadFilePreview(files[0]);
                
                document.getElementById('downloadBtn').style.display = 'inline-block';
            }
        });

        // Отображение списка файлов
        function displayFileList(files) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '<h4>Выбранные файлы:</h4>';
            
            files.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = `file-item ${index === 0 ? 'active-file' : ''}`;
                fileItem.innerHTML = `
                    <div class="file-info">
                        <span class="file-name">${file.name}</span>
                    </div>
                    <div class="file-controls">
                        <button onclick="switchFile(${index})">Выбрать</button>
                        <button onclick="removeFile(${index})">Удалить</button>
                    </div>
                    <div class="file-status" id="fileStatus-${index}">Не обработан</div>
                `;
                fileList.appendChild(fileItem);
            });
        }

        // Переключение между файлами
        function switchFile(index) {
            if (index >= 0 && index < currentFiles.length) {
                currentFileIndex = index;
                loadFilePreview(currentFiles[index]);
                
                // Обновляем активные элементы
                document.querySelectorAll('.file-item').forEach((item, i) => {
                    item.classList.toggle('active-file', i === index);
                });
                
                // Обновляем превью в зависимости от текущего режима
                updatePreviewImage();
            }
        }

        // Удаление файла из списка
        function removeFile(index) {
            if (currentFiles.length <= 1) {
                alert('Должен остаться хотя бы один файл');
                return;
            }
            
            const removedFile = currentFiles[index];
            currentFiles.splice(index, 1);
            
            // Обновляем текущий индекс
            if (currentFileIndex >= index) {
                currentFileIndex = Math.max(0, currentFileIndex - 1);
            }
            
            // Удаляем из обработанных
            delete processedFiles[removedFile.name];
            
            // Обновляем интерфейс
            displayFileList(currentFiles);
            loadFilePreview(currentFiles[currentFileIndex]);
        }

        // Загрузка превью файла
        function loadFilePreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImageData = e.target.result;
                updatePreviewImage();
            };
            reader.readAsDataURL(file);
        }

        // Обновление отображаемого изображения в зависимости от режима
        function updatePreviewImage() {
            const previewImg = document.getElementById('previewImage');
            const currentFile = currentFiles[currentFileIndex];
            
            if (currentPreviewMode === 'original') {
                previewImg.src = originalImageData;
            } else {
                if (processedFiles[currentFile.name]) {
                    previewImg.src = '/download/' + processedFiles[currentFile.name];
                } else {
                    previewImg.src = originalImageData;
                }
            }
            
            previewImg.style.display = 'block';
        }

        // Показать оригинал
        function showOriginal() {
            currentPreviewMode = 'original';
            updatePreviewImage();
        }

        // Показать результат
        function showProcessed() {
            currentPreviewMode = 'processed';
            updatePreviewImage();
        }

        // Переключение меню скачивания
        function toggleDownloadMenu() {
            const menu = document.getElementById('downloadMenu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }

        // Закрытие меню при клике вне его
        document.addEventListener('click', function(event) {
            const downloadBtn = document.getElementById('downloadBtn');
            const downloadMenu = document.getElementById('downloadMenu');
            if (!downloadBtn.contains(event.target) && !downloadMenu.contains(event.target)) {
                downloadMenu.style.display = 'none';
            }
        });

        // Скачивание с выбранным форматом и качеством
        function downloadWithFormat(format, quality = null) {
            const currentFile = currentFiles[currentFileIndex];
            if (!processedFiles[currentFile.name]) {
                alert('Сначала обработайте изображение');
                return;
            }

            let qualityParam = '';
            if (quality) {
                qualityParam = `?quality=${quality}&format=${format}`;
            } else {
                qualityParam = `?format=${format}`;
            }

            window.location.href = '/download/' + processedFiles[currentFile.name] + qualityParam;
            document.getElementById('downloadMenu').style.display = 'none';
        }

        // Функция для генерации царапин
        function generateScratches() {
            addScratchesFlag = true;
            document.getElementById('removeScratchesBtn').style.display = 'inline-block';
            applyEffects();
        }

        // Функция для удаления царапин
        function removeScratches() {
            addScratchesFlag = false;
            document.getElementById('removeScratchesBtn').style.display = 'none';
            applyEffects();
        }

        // ОСНОВНАЯ ФУНКЦИЯ ПРИМЕНЕНИЯ ЭФФЕКТОВ
        async function applyEffects() {
            if (!currentFiles.length) return;
            
            const currentFile = currentFiles[currentFileIndex];

            const formData = new FormData();
            formData.append('image', currentFile);
            
            const params = {
                'sepia_strength': document.getElementById('sepiaSlider').value,
                'noise_intensity': document.getElementById('noiseSlider').value,
                'add_scratches': addScratchesFlag.toString(),
                'scratches_density': document.getElementById('scratchesDensity').value,
                'scratches_alpha': document.getElementById('scratchesAlpha').value,
                'scratches_min_size': document.getElementById('scratchesMinSize').value,
                'scratches_max_size': document.getElementById('scratchesMaxSize').value
            };

            for (const [key, value] of Object.entries(params)) {
                formData.append(key, value);
            }

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    processedFiles[currentFile.name] = result.filename;
                    updateFileStatus(currentFileIndex, 'Обработан');
                    
                    if (currentPreviewMode === 'processed') {
                        updatePreviewImage();
                    }
                } else {
                    console.error('Error:', result.error);
                    updateFileStatus(currentFileIndex, 'Ошибка: ' + result.error);
                }
            } catch (error) {
                console.error('Request failed:', error);
                updateFileStatus(currentFileIndex, 'Ошибка сети');
            }
        }

        // Обновление статуса файла
        function updateFileStatus(index, status) {
            const statusElement = document.getElementById(`fileStatus-${index}`);
            if (statusElement) {
                statusElement.textContent = status;
                if (status.includes('Ошибка')) {
                    statusElement.style.color = 'red';
                } else {
                    statusElement.style.color = '#666';
                }
            }
        }

        function resetSettings() {
            document.getElementById('sepiaSlider').value = 0;
            document.getElementById('noiseSlider').value = 0;
            document.getElementById('scratchesDensity').value = 5;
            document.getElementById('scratchesAlpha').value = 0.5;
            document.getElementById('scratchesMinSize').value = 0.1;
            document.getElementById('scratchesMaxSize').value = 0.3;
            
            document.getElementById('sepiaValue').textContent = '0';
            document.getElementById('noiseValue').textContent = '0';
            document.getElementById('densityValue').textContent = '5';
            document.getElementById('alphaValue').textContent = '0.5';
            document.getElementById('minSizeValue').textContent = '0.1';
            document.getElementById('maxSizeValue').textContent = '0.3';
            
            addScratchesFlag = false;
            document.getElementById('removeScratchesBtn').style.display = 'none';
            
            applyEffects();
        }

        document.getElementById('sepiaSlider').addEventListener('input', (e) => {
            document.getElementById('sepiaValue').textContent = e.target.value;
            applyEffects();
        });

        document.getElementById('noiseSlider').addEventListener('input', (e) => {
            document.getElementById('noiseValue').textContent = e.target.value;
            applyEffects();
        });
    </script>
</body>
</html>
